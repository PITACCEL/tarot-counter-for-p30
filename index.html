<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona 社群好感度計數器</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        h1 { margin-bottom: 30px; letter-spacing: 2px; text-align: center; }
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 360px;
        }
        .btn-entry {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 70px;
            font-size: 24px;
            font-weight: 900;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s ease, filter 0.2s ease;
            color: #fff;
            letter-spacing: 2px;
        }
        .btn-entry:active { transform: scale(0.95); }
        .btn-p3 { background: linear-gradient(135deg, #002b5c, #0077c8); border: 2px solid #00a8ff; }
        .btn-p4 { background: linear-gradient(135deg, #d4a000, #ffe600); color: #000; border: 2px solid #fff; }
        .btn-p5 { background: linear-gradient(135deg, #750000, #e11d48); border: 2px solid #ff4d4d; }
    </style>
</head>
<body>
    <h1>PERSONA TAROT COUNTER</h1>
    <div class="menu-grid">
        <a href="p3.html" class="btn-entry btn-p3">PERSONA 3 (藍)</a>
        <a href="p4.html" class="btn-entry btn-p4">PERSONA 4 (黃)</a>
        <a href="p5.html" class="btn-entry btn-p5">PERSONA 5 (紅)</a>
    </div>
</body>
</html>
