<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P5 塔羅牌計數器</title>
    <!-- PWA / Web App Meta -->
    <meta name="theme-color" content="#750000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* 防止手勢或滾動條干擾 */
            background-color: #750000; /* P5 經典暗紅背景 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            user-select: none;
        }

        /* 主頁面佈局：垂直滿屏 */
        .app-container {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            margin: 0 auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 5 x 2 網格佈局 (2 欄 x 5 列，均分縱向高度) */
        .grid-5x2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px 14px;
            width: 100%;
            flex: 1;
            margin-bottom: 6px;
        }

        /* 單個 3 段式計數器元件容器 */
        .p5-counter-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            height: 100%;
        }

        /* 1. 外置無框純白色實心三角形按鈕 (-1 / +1) */
        .btn-triangle {
            width: 22px;
            height: 36px;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s ease;
            flex-shrink: 0;
            z-index: 10;
            padding: 0;
        }

        .btn-triangle:active {
            transform: scale(0.75);
        }

        .triangle-icon {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
        }

        /* 2. 中間 P5 貼圖框體 (彈性高度自適應) */
        .p5-texture-box {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 72px;
            background-image: url('png-clipart-persona-5-dialog-box-dialogue-computer-icons-art-others-angle-rectangle.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            transition: filter 0.3s ease;
        }

        /* 內容整體定位區 */
        .p5-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding-left: 150px;  
            padding-right: 90px; 
            transform: rotate(1.0deg) translateY(4px);
        }

        /* 卡片名稱 */
        .card-name {
            font-size: 30px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #000;
            white-space: nowrap;
        }

        /* 無框無括號超顯眼大數字 */
        .card-num-plain {
            font-size: 40px;
            font-weight: 900;
            color: #f43f5e; /* P5 經典桃紅 */
            font-family: monospace, sans-serif;
            text-shadow: 3px 3px 0px #000, 0 0 10px rgba(244, 63, 94, 0.6);
            display: inline-block;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        /* 滿分【3】時的金黃高亮特效 */
        .is-max .card-num-plain {
            color: #facc15 !important; 
            text-shadow: 3px 3px 0px #000, 0 0 14px rgba(250, 204, 21, 0.9) !important;
        }

        .is-max .p5-texture-box {
            filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.8));
        }

        /* 數字彈跳動畫 */
        .pop {
            animation: popBounce 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }

        /* 頁尾控制區 */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            backdrop-filter: blur(4px);
            height: 44px;
            flex-shrink: 0;
        }

        .btn-reset {
            background-color: #dc2626;
            color: #ffffff;
            font-weight: 900;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 6px;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn-reset:active {
            transform: scale(0.92);
            background-color: #991b1b;
        }

        /* 專為手機/平板窄螢幕微調 */
        @media (max-width: 768px) {
            .app-container {
                padding: 6px 8px;
            }

            .grid-5x2 {
                gap: 4px 6px;
            }

            .p5-texture-box {
                max-height: 58px;
            }

            .p5-content {
                padding-left: 28%;
                padding-right: 15%;
                transform: rotate(-3.8deg) translateY(2px);
            }

            .card-name {
                font-size: 18px;
            }

            .card-num-plain {
                font-size: 30px;
            }

            .btn-triangle {
                width: 16px;
                height: 30px;
            }

            .triangle-icon {
                width: 13px;
                height: 13px;
            }

            footer {
                height: 38px;
                padding: 4px 10px;
            }

            .btn-reset {
                font-size: 5px;
                padding: 4px 8px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 5x2 網格區域 (10 張卡牌) -->
        <main class="grid-5x2" id="cardsGrid">
            <!-- 由 JavaScript 動態生成 10 個 5x2 卡片組件 -->
        </main>

        <!-- 頁尾控制區域 -->
        <footer>
             <button class="btn-reset" onclick="resetAll()">
                全部重置 RESET
            </button>
        </footer>
    </div>

    <script>
        // 10 張大阿爾克那塔羅牌
        const tarotCards = [
            '愚者', '魔術師',
            '正義', '女帝',
            '信念', '戀人',
            '死神', '星星',
            '戰車', '隱者'
        ];

        // 儲存每張卡牌的計數值 (預設為 0)
        let counts = Array(10).fill(0);

        const cardsGrid = document.getElementById('cardsGrid');

        // 初始化渲染 5x2 網格
        function renderGrid() {
            cardsGrid.innerHTML = '';
            tarotCards.forEach((name, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = `p5-counter-wrapper ${counts[index] === 3 ? 'is-max' : ''}`;
                wrapper.id = `wrapper-${index}`;

                wrapper.innerHTML = `
                    <!-- 左側無框純白色實心三角形按鈕 (-1) -->
                    <button class="btn-triangle" onclick="changeCount(${index}, -1, event)">
                        <svg class="triangle-icon" viewBox="0 0 24 24">
                            <polygon points="17,4 6,12 17,20"/>
                        </svg>
                    </button>

                    <!-- 中間 P5 對話框貼圖框體 (+1) -->
                    <div class="p5-texture-box" onclick="changeCount(${index}, 1, event)">
                        <div class="p5-content">
                            <span class="card-name">${name}</span>
                            <span class="card-num-plain" id="num-${index}">${counts[index]}</span>
                        </div>
                    </div>

                    <!-- 右側無框純白色實心三角形按鈕 (+1) -->
                    <button class="btn-triangle" onclick="changeCount(${index}, 1, event)">
                        <svg class="triangle-icon" viewBox="0 0 24 24">
                            <polygon points="7,4 18,12 7,20"/>
                        </svg>
                    </button>
                `;

                cardsGrid.appendChild(wrapper);
            });
        }

        // 計數變更邏輯 (0 ~ 3 雙向循環)
        function changeCount(index, delta, event) {
            if (event) event.stopPropagation();

            let val = counts[index] + delta;
            if (val > 3) val = 0;
            if (val < 0) val = 3;

            counts[index] = val;

            const numEl = document.getElementById(`num-${index}`);
            const wrapper = document.getElementById(`wrapper-${index}`);

            numEl.innerText = val;

            // 滿分 3 切換金黃高亮狀態
            if (val === 3) {
                wrapper.classList.add('is-max');
            } else {
                wrapper.classList.remove('is-max');
            }

            // 觸發數字彈跳動畫
            numEl.classList.remove('pop');
            void numEl.offsetWidth; // 強制重繪觸發動畫
            numEl.classList.add('pop');
        }

        // 全部重置歸零
        function resetAll() {
            counts = Array(10).fill(0);
            tarotCards.forEach((_, index) => {
                const numEl = document.getElementById(`num-${index}`);
                const wrapper = document.getElementById(`wrapper-${index}`);
                if (numEl && wrapper) {
                    numEl.innerText = '0';
                    wrapper.classList.remove('is-max');
                    numEl.classList.remove('pop');
                    void numEl.offsetWidth;
                    numEl.classList.add('pop');
                }
            });
        }

        // 初始化啟動
        renderGrid();
    </script>
</body>
</html>
