<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔羅牌計數器 - 統一背景與標題置中</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #750000; /* 深邃紅背景 */
            color: #f1f1f3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        /* 統一卡片樣式：全卡片共用同一張背景圖與調淡遮罩 */
        .card-unit {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            border: 2px solid #52525b;
            border-radius: 16px;
            padding: 20px;
            overflow: hidden;
            /* 💡 統一背景圖片：此處可替換成你喜歡的單一底圖或卡背網址 */
            background-image: linear-gradient(rgba(13, 13, 15, 0.8), rgba(13, 13, 15, 0.8)), url('https://assets.games.gg/Persona_30th_Anniversary_Leaks_a2fd035d35.png');
            background-size: cover;
            background-position: center;
            min-height: 220px; /* 框體高度可依需求調整 */
        }

        /* 頂部名稱標題框：已設定為水平置中 */
        .title-box {
            font-size: 24px;
            font-weight: bold;
            color: #f43f5e;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center; /* 💡 讓塔羅牌名稱居中 */
            text-align: center;
            width: 100%;
            padding-bottom: 4px;
        }

        .counter-section {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
        }

        .num-btn {
            width: 70px;
            height: 90px;
            border: 2px solid #f43f5e;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
            background: rgba(39, 39, 42, 0.85);
            cursor: pointer;
            user-select: none;
            flex-shrink: 0;
            transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.3);
        }

        .num-btn:active {
            transform: scale(0.92);
            background: #f43f5e;
            color: #0d0d0f;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.8);
        }

        .status-box {
            display: flex;
            align-items: center;
        }

        .completed-mark {
            color: #f43f5e;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 12px rgba(244, 63, 94, 0.6);
            line-height: 1.3;
        }

        .reset-area {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .reset-btn {
            background: #18181b;
            border: 2px solid #f43f5e;
            border-radius: 14px;
            padding: 12px 24px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.15);
            transition: background 0.2s ease;
        }

        .reset-btn:active {
            background: #27272a;
        }

        .reset-title {
            color: #f43f5e;
            font-weight: bold;
            font-size: 16px;
        }

        .reset-desc {
            font-size: 12px;
            color: #71717a;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">

        <div class="cards-grid">

            <!-- 1. 愚者 -->
            <div class="card-unit">
                <div class="title-box"><span>愚者</span></div>
                <div class="counter-section">
                    <div class="num-btn" id="btn-0" onclick="addCount(0)">1</div>
                    <div class="status-box" id="status-0"></div>
                </div>
            </div>

            <!-- 2. 魔術師 -->
            <div class="card-unit">
                <div class="title-box"><span>魔術師</span></div>
                <div class="counter-section">
                    <div class="num-btn" id="btn-1" onclick="addCount(1)">1</div>
                    <div class="status-box" id="status-1"></div>
                </div>
            </div>

            <!-- 3. 正義 -->
            <div class="card-unit">
                <div class="title-box"><span>正義</span></div>
                <div class="counter-section">
                    <div class="num-btn" id="btn-2" onclick="addCount(2)">1</div>
                    <div class="status-box" id="status-2"></div>
                </div>
            </div>

            <!-- 4. 女帝 -->
            <div class="card-unit">
                <div class="title-box"><span>女帝</span></div>
                <div class="counter-section">
                    <div class="num-btn" id="btn-3" onclick="addCount(3)">1</div>
                    <div class="status-box" id="status-3"></div>
                </div>
            </div>

            <!-- 5. 信念 -->
            <div class="card-unit">
                <div class="title-box"><span>信念</span></div>
                <div class="counter-section">
                    <div class="num-btn" id="btn-4" onclick="addCount(4)">1</div>
                    <div class="status-box" id="status-4"></div>
                </div>
            </div>

            <!-- 6. 愛情 -->
            <div class="card-unit">
                <div class="title-box"><span>愛情</span></div>
                <div class="counter-section">
                    <div class="num-btn" id="btn-5" onclick="addCount(5)">1</div>
                    <div class="status-box" id="status-5"></div>
                </div>
            </div>

            <!-- 7. 死神 -->
            <div class="card-unit">
                <div class="title-box"><span>死神</span></div>
                <div class="counter-section">
                    <div class="num-btn" id="btn-6" onclick="addCount(6)">1</div>
                    <div class="status-box" id="status-6"></div>
                </div>
            </div>

            <!-- 8. 星 -->
            <div class="card-unit">
                <div class="title-box"><span>星</span></div>
                <div class="counter-section">
                    <div class="num-btn" id="btn-7" onclick="addCount(7)">1</div>
                    <div class="status-box" id="status-7"></div>
                </div>
            </div>

        </div>

        <div class="reset-area">
            <div class="reset-btn" onclick="resetAllCounts()">
                <div class="reset-title">重置按鈕</div>
                <div class="reset-desc">(會讓所有數字重新回到1)</div>
            </div>
        </div>

    </div>

    <script>
        var counts = [1, 1, 1, 1, 1, 1, 1, 1];

        function addCount(index) {
            if (counts[index] >= 3) {
                counts[index] = 1;
            } else {
                counts[index] = counts[index] + 1;
            }
            refreshView(index);
        }

        function resetAllCounts() {
            for (var i = 0; i < counts.length; i++) {
                counts[i] = 1;
                refreshView(i);
            }
        }

        function refreshView(index) {
            var btn = document.getElementById('btn-' + index);
            var status = document.getElementById('status-' + index);

            if (btn) {
                btn.innerHTML = counts[index];
            }

            if (status) {
                if (counts[index] === 3) {
                    status.innerHTML = '<span class="completed-mark">好感度已最高</span>';
                } else {
                    status.innerHTML = '';
                }
            }
        }
    </script>

</body>
</html>
